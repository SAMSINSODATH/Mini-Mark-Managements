<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Mart - Register</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f8f3;
    display: flex;
    justify-content: center;
    align-items: center;
">

```
<!-- Main Container -->
<div style="
    width: 900px;
    max-width: 92%;
    min-height: 540px;
    display: flex;
    border-radius: 22px;
    overflow: hidden;
    background: white;
    box-shadow: 0 15px 45px rgba(0,0,0,0.12);
">

    <!-- Left Side -->
    <div style="
        width: 45%;
        padding: 45px;
        box-sizing: border-box;
        background: linear-gradient(145deg, #15803d, #22c55e);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
    ">

        <!-- Logo -->
        <div style="
            width: 75px;
            height: 75px;
            background: white;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        ">
            🛒
        </div>

        <h1 style="
            margin: 0 0 12px;
            font-size: 36px;
            line-height: 1.15;
        ">
            Mini Mart
        </h1>

        <p style="
            margin: 0 0 30px;
            font-size: 16px;
            line-height: 1.6;
            color: rgba(255,255,255,0.9);
        ">
            Everything you need,<br>
            right at your fingertips.
        </p>

        <!-- Features -->
        <div style="
            margin-bottom: 14px;
            font-size: 14px;
        ">
            🥦 &nbsp; Fresh groceries
        </div>

        <div style="
            margin-bottom: 14px;
            font-size: 14px;
        ">
            🛍️ &nbsp; Easy shopping
        </div>

        <div style="
            font-size: 14px;
        ">
            🚚 &nbsp; Fast delivery
        </div>

    </div>


    <!-- Right Side -->
    <div style="
        width: 55%;
        padding: 45px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
    ">

        <h2 style="
            margin: 0;
            color: #1f2937;
            font-size: 28px;
        ">
            Create Your Account
        </h2>

        <p style="
            margin: 8px 0 28px;
            color: #6b7280;
            font-size: 14px;
        ">
            Sign up to start shopping at Mini Mart.
        </p>


        <form id="registerForm">

            <!-- Username -->
            <label style="
                display: block;
                margin-bottom: 7px;
                color: #374151;
                font-size: 14px;
                font-weight: bold;
            ">
                Username
            </label>

            <div style="
                position: relative;
                margin-bottom: 18px;
            ">

                <span style="
                    position: absolute;
                    left: 14px;
                    top: 50%;
                    transform: translateY(-50%);
                    font-size: 17px;
                ">
                    👤
                </span>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                    style="
                        width: 100%;
                        box-sizing: border-box;
                        padding: 13px 14px 13px 43px;
                        border: 1px solid #d1d5db;
                        border-radius: 10px;
                        outline: none;
                        font-size: 14px;
                        background: #f9fafb;
                    "
                >

            </div>


            <!-- Email -->
            <label style="
                display: block;
                margin-bottom: 7px;
                color: #374151;
                font-size: 14px;
                font-weight: bold;
            ">
                Email
            </label>

            <div style="
                position: relative;
                margin-bottom: 18px;
            ">

                <span style="
                    position: absolute;
                    left: 14px;
                    top: 50%;
                    transform: translateY(-50%);
                    font-size: 17px;
                ">
                    ✉️
                </span>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    style="
                        width: 100%;
                        box-sizing: border-box;
                        padding: 13px 14px 13px 43px;
                        border: 1px solid #d1d5db;
                        border-radius: 10px;
                        outline: none;
                        font-size: 14px;
                        background: #f9fafb;
                    "
                >

            </div>


            <!-- Password -->
            <label style="
                display: block;
                margin-bottom: 7px;
                color: #374151;
                font-size: 14px;
                font-weight: bold;
            ">
                Password
            </label>

            <div style="
                position: relative;
                margin-bottom: 23px;
            ">

                <span style="
                    position: absolute;
                    left: 14px;
                    top: 50%;
                    transform: translateY(-50%);
                    font-size: 17px;
                ">
                    🔒
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                    style="
                        width: 100%;
                        box-sizing: border-box;
                        padding: 13px 14px 13px 43px;
                        border: 1px solid #d1d5db;
                        border-radius: 10px;
                        outline: none;
                        font-size: 14px;
                        background: #f9fafb;
                    "
                >

            </div>


            <!-- Register Button -->
            <button
                type="submit"
                style="
                    width: 100%;
                    padding: 14px;
                    border: none;
                    border-radius: 10px;
                    background: #16a34a;
                    color: white;
                    font-size: 16px;
                    font-weight: bold;
                    cursor: pointer;
                    box-shadow: 0 5px 15px rgba(22,163,74,0.25);
                "
            >
                🛒 Create Account
            </button>

        </form>


        <!-- Login -->
        <p style="
            text-align: center;
            margin: 22px 0 0;
            color: #6b7280;
            font-size: 14px;
        ">
            Already have an account?

            <a
                href="login.html"
                style="
                    color: #16a34a;
                    text-decoration: none;
                    font-weight: bold;
                    margin-left: 4px;
                "
            >
                Login
            </a>
        </p>

        <!-- Footer -->
        <p style="
            text-align: center;
            margin: 20px 0 0;
            color: #9ca3af;
            font-size: 11px;
        ">
            © 2026 Mini Mart • Fresh • Simple • Fast
        </p>

    </div>

</div>

<script src="auth.js"></script>
```

</body>

</html>
