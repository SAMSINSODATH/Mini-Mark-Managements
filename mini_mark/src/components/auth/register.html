<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Mart - Register</title>
</head>

<body style="margin:0; padding:0; font-family:Arial, sans-serif; background:#f4f6f8;">

    <div style="
        width:380px;
        margin:50px auto;
        padding:30px;
        background:white;
        border-radius:12px;
        box-shadow:0 5px 20px rgba(0,0,0,0.15);
    ">

        <h1 style="
            text-align:center;
            color:#198754;
            margin:0 0 5px 0;
        ">
            🛒 Mini Mart
        </h1>

        <p style="
            text-align:center;
            color:#777;
            margin:0 0 25px 0;
        ">
            Create Customer Account
        </p>

        <form id="registerForm">

            <label style="
                display:block;
                margin-bottom:7px;
                font-weight:bold;
                color:#333;
            ">
                Full Name
            </label>

            <input
                id="name"
                type="text"
                placeholder="Enter full name"
                style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    margin-bottom:15px;
                    border:1px solid #ccc;
                    border-radius:6px;
                    outline:none;
                "
            >

            <label style="
                display:block;
                margin-bottom:7px;
                font-weight:bold;
                color:#333;
            ">
                Username
            </label>

            <input
                id="username"
                type="text"
                placeholder="Enter username"
                style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    margin-bottom:15px;
                    border:1px solid #ccc;
                    border-radius:6px;
                    outline:none;
                "
            >

            <label style="
                display:block;
                margin-bottom:7px;
                font-weight:bold;
                color:#333;
            ">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter email"
                style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    margin-bottom:15px;
                    border:1px solid #ccc;
                    border-radius:6px;
                    outline:none;
                "
            >

            <label style="
                display:block;
                margin-bottom:7px;
                font-weight:bold;
                color:#333;
            ">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Enter password"
                style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    margin-bottom:15px;
                    border:1px solid #ccc;
                    border-radius:6px;
                    outline:none;
                "
            >

            <label style="
                display:block;
                margin-bottom:7px;
                font-weight:bold;
                color:#333;
            ">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm password"
                style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    margin-bottom:20px;
                    border:1px solid #ccc;
                    border-radius:6px;
                    outline:none;
                "
            >

            <button
                type="submit"
                style="
                    width:100%;
                    padding:12px;
                    border:none;
                    border-radius:6px;
                    background:#198754;
                    color:white;
                    font-size:16px;
                    font-weight:bold;
                    cursor:pointer;
                "
            >
                Register
            </button>

            <p id="registerMessage" style="
                text-align:center;
                min-height:20px;
                margin:15px 0 0 0;
            "></p>

        </form>

        <p style="
            text-align:center;
            color:#666;
            margin-top:20px;
        ">
            Already have an account?

            <a
                href="login.html"
                style="
                    color:#198754;
                    text-decoration:none;
                    font-weight:bold;
                "
            >
                Login
            </a>
        </p>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
