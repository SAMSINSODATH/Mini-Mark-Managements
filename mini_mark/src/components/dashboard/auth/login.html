<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Mart - Login</title>
</head>

<body style="margin:0; padding:0; font-family:Arial, sans-serif; background:#f4f6f8;">

    <div style="
        width:360px;
        margin:100px auto;
        padding:30px;
        background:white;
        border-radius:12px;
        box-shadow:0 5px 20px rgba(0,0,0,0.15);
    ">

        <div style="
            text-align:center;
            margin-bottom:25px;
        ">

            <div style="
                font-size:45px;
                margin-bottom:5px;
            ">
                🛒
            </div>

            <h1 style="
                margin:0;
                color:#198754;
            ">
                Mini Mart
            </h1>

            <p style="
                color:#777;
                margin:8px 0 0 0;
            ">
                Customer Login
            </p>

        </div>

        <form id="loginForm">

            <label style="
                display:block;
                margin-bottom:7px;
                font-weight:bold;
                color:#333;
            ">
                Username
            </label>

            <input
                id="loginUsername"
                type="text"
                placeholder="Enter username"
                style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    margin-bottom:18px;
                    border:1px solid #ccc;
                    border-radius:6px;
                    outline:none;
                "
            >

            <label style="
                display:block;
                margin-bottom:7px;
                font-weight:bold;
                color:#333;
            ">
                Password
            </label>

            <input
                id="loginPassword"
                type="password"
                placeholder="Enter password"
                style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    margin-bottom:20px;
                    border:1px solid #ccc;
                    border-radius:6px;
                    outline:none;
                "
            >

            <button
                type="submit"
                style="
                    width:100%;
                    padding:13px;
                    border:none;
                    border-radius:6px;
                    background:#198754;
                    color:white;
                    font-size:16px;
                    font-weight:bold;
                    cursor:pointer;
                "
            >
                Login to Mini Mart
            </button>

            <p id="loginMessage" style="
                text-align:center;
                min-height:20px;
                margin:15px 0 0 0;
            "></p>

        </form>

        <div style="
            text-align:center;
            margin-top:20px;
            padding-top:20px;
            border-top:1px solid #eee;
        ">

            <p style="
                color:#666;
                margin:0;
            ">
                Don't have an account?
            </p>

            <a
                href="register.html"
                style="
                    display:inline-block;
                    margin-top:10px;
                    color:#198754;
                    text-decoration:none;
                    font-weight:bold;
                "
            >
                Create Account
            </a>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
